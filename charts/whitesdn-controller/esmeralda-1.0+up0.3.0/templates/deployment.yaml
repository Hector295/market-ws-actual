apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-manager
  labels:
    control-plane: manager
  {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      control-plane: manager
    {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        control-plane: manager
      {{- include "chart.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      containers:
      - args: {{- toYaml .Values.manager.manager.args | nindent 8 }}
        command:
        - /manager
        env:
        - name: WHITESDN_URL
          valueFrom:
            configMapKeyRef:
              key: URL
              name: {{ include "chart.fullname" . }}-whitesdn-config
        - name: WHITESDN_USER
          valueFrom:
            configMapKeyRef:
              key: USER
              name: {{ include "chart.fullname" . }}-whitesdn-config
        - name: WHITESDN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PASSWORD
              name: {{ include "chart.fullname" . }}-whitesdn-secrets
        - name: WHITESDN_AZ
          valueFrom:
            configMapKeyRef:
              key: AVAILABILITY_ZONE
              name: {{ include "chart.fullname" . }}-whitesdn-config
        - name: INSECURE_SKIP_VERIFY
          valueFrom:
            configMapKeyRef:
              key: INSECURE_SKIP_VERIFY
              name: {{ include "chart.fullname" . }}-whitesdn-config
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.manager.manager.image.repository }}:{{ .Values.manager.manager.image.tag
          | default .Chart.AppVersion }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {{- toYaml .Values.manager.manager.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.manager.manager.containerSecurityContext |
          nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: whitesdn-state
        - mountPath: /certs
          name: whitesdn-ca-cert
      securityContext: {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "chart.fullname" . }}-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          name: {{ include "chart.fullname" . }}-whitesdn-state
        name: whitesdn-state
      - configMap:
          name: {{ include "chart.fullname" . }}-whitesdn-ca-cert
        name: whitesdn-ca-cert
