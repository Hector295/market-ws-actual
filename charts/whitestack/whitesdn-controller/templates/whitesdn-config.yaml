apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-whitesdn-config
  labels:
  {{- include "chart.labels" . | nindent 4 }}
data:
  AVAILABILITY_ZONE: {{ .Values.whitesdnConfig.availabilityZone | quote }}
  ERROR_REQUEUE_TIME_SECONDS: {{ .Values.whitesdnConfig.errorRequeueTimeSeconds |
    quote }}
  INSECURE_SKIP_VERIFY: {{ .Values.whitesdnConfig.insecureSkipVerify | quote }}
  REQUEUE_TIME_SECONDS: {{ .Values.whitesdnConfig.requeueTimeSeconds | quote }}
  URL: {{ .Values.whitesdnConfig.url | quote }}
  USER: {{ .Values.whitesdnConfig.user | quote }}
